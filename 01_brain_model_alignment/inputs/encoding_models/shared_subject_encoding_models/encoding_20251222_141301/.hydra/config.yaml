  n_folds: 5
  alpha_aggregation: median
  store_fold_alphas: true
  seed: 42
  scale_features: false
ridge:
  alpha_min: 0.1
  alpha_max: 1000000.0
  n_alphas: 20
extraction:
  batch_size: 64
  device: cuda
output:
  make_plots: true
  fig_dpi: 120
  save_oof_predictions: false
  skip_existing: true
resume_from: null
paths:
  model_list_csv: /u/rothj/cstims/data/resources/model_list.csv
  cache_root: /ptmp/rothj/deepvision_fmri/cache
  deepvision_root: /ptmp/rothj/deepvision_fmri
