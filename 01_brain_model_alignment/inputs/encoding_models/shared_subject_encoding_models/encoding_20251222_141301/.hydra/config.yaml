parallel:
  subject: sub-06
  model_batch: 4
  models_per_batch: 5
  model_filter: null
subjects:
- sub-01
- sub-03
- sub-05
- sub-06
- sub-07
benchmark:
  voxel_set: visual
  cve_threshold: 0.2
  input_source: finalinterp
preprocessing:
  response_zscore: false
  srp: false
  srp_eps: 0.1
evaluation:
  rois:
  - visual
  - hlvis
fitting:
