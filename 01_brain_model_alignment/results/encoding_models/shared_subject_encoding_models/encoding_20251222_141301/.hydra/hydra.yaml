    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/u/rothj/cstims/experiments/encoding_fitting/results/encoding_20251222_141301
    - hydra.mode=RUN
    task:
    - parallel.subject=sub-01
    - parallel.model_batch=3
    - parallel.models_per_batch=5
    - fitting.eval_method=random_kfold
    - fitting.n_folds=5
    - fitting.scale_features=false
    - preprocessing.response_zscore=false
    - preprocessing.srp=false
  job:
    name: fit_encoding_hydra
    chdir: false
    override_dirname: fitting.eval_method=random_kfold,fitting.n_folds=5,fitting.scale_features=false,parallel.model_batch=3,parallel.models_per_batch=5,parallel.subject=sub-01,preprocessing.response_zscore=false,preprocessing.srp=false
    id: ???
    num: ???
    config_name: encoding_fit
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /tmp
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /raven/u/rothj/cstims/experiments/encoding_fitting/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /u/rothj/cstims/experiments/encoding_fitting/results/encoding_20251222_141301
    choices:
      paths: raven
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
